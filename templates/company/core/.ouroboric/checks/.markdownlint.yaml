# The base CI's markdown rules, minus the bends only a software repo needs.
default: true
MD013: false
MD024:
  siblings_only: true
# A doc's front matter title and its H1 say the same thing.
MD025:
  front_matter_title: ""
# The docs standard prescribes <picture> for themed images.
MD033:
  allowed_elements: [picture, source, img]
# Journal entries open without an H1; the docs check requires every doc's title in its front matter.
MD041: false
