# The company's checks, on every pull request and on main: lint, secrets, the docs and their pages.
# The checks themselves are in .ouroboric/checks/run.sh, so they run the same here and on a laptop.
name: checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - name: install the tools
        run: pip install pre-commit==4.6.2 mkdocs==1.5.3 mkdocs-material==9.2.7
      - name: checks
        run: .ouroboric/checks/run.sh
