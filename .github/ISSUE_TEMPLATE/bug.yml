# Issue form: a bug in the asgard factory. Nothing acts on issues automatically.
name: Bug report
description: Something in the asgard factory does not work as documented.
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste a private project's code, data or secrets here.** This repository is public.
        Describe the problem in your own words, and leave out anything you would not publish.
  - type: input
    id: factory-version
    attributes:
      label: Factory version
      description: The asgard version or commit you ran.
    validations:
      required: true
  - type: input
    id: config-hash
    attributes:
      label: Config hash
      description: The config hash of the run.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What went wrong
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
