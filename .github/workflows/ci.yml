# CI: the check "test". It runs every script test in scripts/tests/: the brand suite in parallel shards (SHARD names the
# sections of scripts/tests/brand.test.sh a job runs; every section is in one shard) and the other files in one job.
# The job "test" is the gate: the branch ruleset requires it, and it passes only when every shard passed.
# The company checks test compares the company
# template's lint settings with the base CI's pieces, so ouroboric is checked out beside this repo, as in the tree.
# The pr-bot can't change this file (it has no workflows permission); the founder pushes changes to it.
name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  shards:
    name: shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [tools, fonts, proposals, choice, pages, playground, others]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          path: asgard
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          repository: ouroboric-dev/ouroboric
          path: ouroboric
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - name: install the tools the tests run
        run: pip install pre-commit==4.6.2 mkdocs==1.5.3 mkdocs-material==9.2.7 fonttools==4.66.1 brotli==1.2.0
      - name: set up the brand tools
        working-directory: asgard
        run: scripts/brand.sh setup
      - name: test
        working-directory: asgard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          if [ "$SHARD" != others ]; then
            bash scripts/tests/brand.test.sh
            exit
          fi
          fail=0
          for t in scripts/tests/*.test.sh; do
            [ "$t" = scripts/tests/brand.test.sh ] && continue
            echo "## $t"
            bash "$t" || fail=1
          done
          exit "$fail"
  test:
    needs: shards
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: every shard passed
        env:
          RESULT: ${{ needs.shards.result }}
        run: '[ "$RESULT" = success ]'
